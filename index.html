<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">

  <title>Masud | Student & Creator</title>
  <meta name="description"
        content="Welcome to Masud's personal website. Connect with Masud through social media or email.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070b14;
      --card: #101827;
      --blue: #168cff;
      --cyan: #42d9ff;
      --text: #f5f8ff;
      --muted: #9baac0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, #102c51 0%, transparent 55%),
        var(--bg);
    }

    .profile {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(16, 24, 39, 0.94);
      border: 1px solid rgba(66, 169, 255, 0.25);
      border-radius: 26px;
      box-shadow: 0 20px 70px rgba(0, 100, 255, 0.12);
    }

    .avatar {
      width: 132px;
      height: 132px;
      margin: 0 auto 22px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 28px rgba(22, 140, 255, 0.25);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      background: #17263b;
    }

    .eyebrow {
      margin-bottom: 9px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(34px, 9vw, 43px);
      letter-spacing: -1px;
    }

    .intro {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
    }

    .line {
      width: 55px;
      height: 3px;
      margin: 23px auto;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    .connect-title {
      margin-bottom: 16px;
      font-size: 14px;
      color: #d8e7fa;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .social {
      min-height: 52px;
      padding: 15px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      border: 1px solid #293b54;
      border-radius: 13px;
      background: #131f31;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: transform 0.2s, border-color 0.2s,
                  background 0.2s;
    }

    .social:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
      background: #192b43;
    }

    .social .symbol {
      width: 23px;
      font-size: 19px;
      font-weight: bold;
    }

    .facebook .symbol { color: #65a9ff; }
    .instagram .symbol { color: #ff8bc2; }
    .whatsapp .symbol { color: #48e68b; }
    .email .symbol { color: #66c8ff; }

    .footer {
      margin-top: 27px;
      color: #788aa3;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer strong {
      color: #b9dfff;
    }

    @media (max-width: 360px) {
      .profile {
        padding: 26px 17px;
      }

      .avatar {
        width: 112px;
        height: 112px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="profile">

    <!-- Replace profile.jpg with your own photo file -->
    <div class="avatar">
      <img
        src="profile.jpg"
        alt="Masud's profile photo"
        onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 132 132%22%3E%3Crect width=%22132%22 height=%22132%22 fill=%22%2317263b%22/%3E%3Ctext x=%2266%22 y=%2279%22 text-anchor=%22middle%22 font-size=%2248%22 fill=%22%2342d9ff%22 font-family=%22Arial%22%3EM%3C/text%3E%3C/svg%3E';"
      >
    </div>

    <p class="eyebrow">PERSONAL WEBSITE</p>

    <h1>Masud</h1>

    <p class="intro">Student &amp; Creator</p>

    <div class="line"></div>

    <p class="connect-title">Let's connect with me</p>

    <nav class="links" aria-label="Contact and social media">

      <a
        class="social facebook"
        href="https://www.facebook.com/share/1C1bCwDsFF/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="symbol" aria-hidden="true">f</span>
        <span>Facebook</span>
      </a>

      <a
        class="social instagram"
        href="https://www.instagram.com/epocsotehts_0.7?cplk=Z3I2ZjdveWs4aHg1"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="symbol" aria-hidden="true">◎</span>
        <span>Instagram</span>
      </a>

      <a
        class="social whatsapp"
        href="https://wa.me/qr/HZCDL5PWKDLCP1"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="symbol" aria-hidden="true">◉</span>
        <span>WhatsApp</span>
      </a>

      <a
        class="social email"
        href="mailto:abrarmasud2008@gmail.com"
      >
        <span class="symbol" aria-hidden="true">✉</span>
        <span>Send Me an Email</span>
      </a>

    </nav>

    <footer class="footer">
      <p>One link. All my socials.</p>
      <p>Made with <strong>♥</strong> by masud</p>
    </footer>

  </main>
</body>
        </html>
